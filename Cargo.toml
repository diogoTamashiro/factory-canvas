[package]
name = "factory-canvas"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "factory-canvas"

[[bin]]
name = "factory-canvas"
path = "src/egui_main.rs"

[[bin]]
name = "factory-canvas-legacy"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
iced = "0.13"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = { version = "0.17", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3.27"
uuid = { version = "1.24", features = ["v4"] }
anyhow = "1"
screenshots = "0.8"
